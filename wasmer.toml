[package]
name = "aerox-music-app"
version = "2.0.0"
description = "AeroX Music Web App"

[dependencies]
"wasmer/static-web-server" = "^1"

[[command]]
name = "start"
module = "wasmer/static-web-server:webserver"
runner = "wasi"

[command.annotations.wasi]
env = ["PORT=80"]
main-args = ["-d", "/app/dist", "--page-fallback", "/app/dist/index.html"]

[[fs]]
"/app/dist" = "./dist"
